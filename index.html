    /* Strict Universal Text Wrapping & Overflow Guardrails */
    *, ::before, ::after {

      word-break: break-word !important;
      max-width: 100%;
    }
    
    .break-jp {
      word-break: break-all !important;

    }

      min-width: 0 !important;
    }

      max-height: 220px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
    }
    
    /* Ambient Liquid Animated Background Mesh */
    .bg-mesh {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      background: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.25) 0%, transparent 40%),
                  radial-gradient(circle at 85% 75%, rgba(139, 92, 246, 0.2) 0%, transparent 45%),
                  radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.15) 0%, transparent 50%),
                  radial-gradient(circle at 20% 80%, rgba(244, 63, 94, 0.15) 0%, transparent 35%);
      filter: blur(60px);
      animation: pulse-slow 8s ease-in-out infinite alternate;
    }
    
    /* Liquid Glassmorphism CSS Utilities */
    .glass-panel {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .glass-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }
    .glass-input {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      color: #ffffff;
    }
    .glass-input:focus {
      outline: none;
      border-color: #8b5cf6;
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
    }
    
    /* Flip Card 3D Animation */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.45);
    }
  </style>
</head>

    const translateToKorean = async (englishText) => {
      if (!englishText || typeof englishText !== 'string') return "뜻 정보 없음";
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ko&dt=t&q=${encodeURIComponent(englishText)}`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          if (data && data[0] && Array.isArray(data[0])) {
            const translated = data[0].map(segment => segment[0]).join('');
            if (translated && translated.trim().length > 0) {
              return translated.trim();
            }
          }
        }
      } catch (err) {
        console.warn("Translation service unavailable, fallback to original:", err);
      }
      return englishText;
    };

    function App() {
      const [words, setWords] = useState(() => {
        try {
          const saved = localStorage.getItem('jlpt_n2_words');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {
          console.error("Failed to load words from localStorage", e);
        }
        return INITIAL_WORDS;
      });

      const [savedWordIds, setSavedWordIds] = useState(() => {
        try {
          const saved = localStorage.getItem('jlpt_n2_bookmarks');
          return saved ? JSON.parse(saved) : ["seed_1", "seed_2"];
        } catch (e) {
          return ["seed_1", "seed_2"];
        }
      });

      const [wordSets, setWordSets] = useState(() => {
        try {
          const saved = localStorage.getItem('jlpt_n2_sets');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {}
        return [
          { id: "set_default_1", name: "⭐ 핵심 어휘 모음", wordIds: ["seed_1", "seed_2", "seed_3"], color: "from-indigo-500 to-purple-600" }
        ];
      });

      const [currentTab, setCurrentTab] = useState('flashcards');
      const [isFetchingGithub, setIsFetchingGithub] = useState(false);
      const [githubLevel, setGithubLevel] = useState(2);
      const [githubLimit, setGithubLimit] = useState(10);
      const [toastMsg, setToastMsg] = useState(null);
      const [activeSetFilter, setActiveSetFilter] = useState('all');
      const [showResetModal, setShowResetModal] = useState(false);

      useEffect(() => {
        try {
          localStorage.setItem('jlpt_n2_words', JSON.stringify(words));
        } catch (e) {}
      }, [words]);

      useEffect(() => {
        try {
          localStorage.setItem('jlpt_n2_bookmarks', JSON.stringify(savedWordIds));
        } catch (e) {}
      }, [savedWordIds]);

      useEffect(() => {
        try {
          localStorage.setItem('jlpt_n2_sets', JSON.stringify(wordSets));
        } catch (e) {}
      }, [wordSets]);

      const showToast = useCallback((msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3500);
      }, []);

      const confirmResetAllData = () => {
        localStorage.removeItem('jlpt_n2_words');
        localStorage.removeItem('jlpt_n2_bookmarks');
        localStorage.removeItem('jlpt_n2_sets');
        setWords(INITIAL_WORDS);
        setSavedWordIds(["seed_1", "seed_2"]);
        setWordSets([{ id: "set_default_1", name: "⭐ 핵심 어휘 모음", wordIds: ["seed_1", "seed_2"], color: "from-indigo-500 to-purple-600" }]);
        setActiveSetFilter('all');
        setShowResetModal(false);
        showToast("초기 필수 데이터베이스 상태로 복원되었습니다.");
      };

      const toggleBookmark = (id) => {
        setSavedWordIds(prev => {
          const isSaved = prev.includes(id);
          const next = isSaved ? prev.filter(wId => wId !== id) : [...prev, id];
          showToast(isSaved ? "북마크에서 제거되었습니다." : "북마크에 저장되었습니다.");
          return next;
        });
      };

      const updateMastery = (id, delta) => {
        setWords(prev => prev.map(w => {
          if (w.id === id) {
            const newLevel = Math.max(0, Math.min(5, (w.mastery || 0) + delta));
            return { ...w, mastery: newLevel };
          }
          return w;
        }));
      };

      const fetchWordsFromGithubApi = async (isRandom = false, requestedLimit) => {
        setIsFetchingGithub(true);
        const fetchCount = requestedLimit || githubLimit;
        showToast(`JLPT N${githubLevel} API 수집 및 한국어 실시간 번역 중...`);

        const existingWords = new Set(words.map(w => w.kanji || w.word));

        try {
          const baseUrl = 'https://jlpt-vocab-api.vercel.app/api/words';
          const endpoint = isRandom
            ? `${baseUrl}/random?level=${githubLevel}`
            : `${baseUrl}?level=${githubLevel}&limit=${fetchCount}&offset=${Math.floor(Math.random() * 40)}`;

          const res = await fetch(endpoint);
          if (!res.ok) throw new Error("API 요청 실패");

          const responseData = await res.json();
          let fetchedList = [];

          if (Array.isArray(responseData.words)) {
            fetchedList = responseData.words;
          } else if (responseData.word) {
            fetchedList = [responseData];
          } else if (Array.isArray(responseData)) {
            fetchedList = responseData;
          }

          if (fetchedList.length === 0) throw new Error("데이터 수신 실패");

          const formattedWordsPromises = fetchedList.map(async (item, i) => {
            const kanjiTerm = item.word || item.kanji;
            if (!kanjiTerm || existingWords.has(kanjiTerm)) return null;

            const furiganaReading = item.furigana || kanjiTerm;
            const englishMeaning = item.meaning || `JLPT N${githubLevel} Word`;
            const koreanMeaning = await translateToKorean(englishMeaning);

            return {
              id: `gh_jlpt_${Date.now()}_${i}_${Math.random().toString(36).substr(2, 5)}`,
              kanji: kanjiTerm,
              furigana: furiganaReading,
              romaji: item.romaji || "",
              meaning_kr: koreanMeaning,
              meaning_en: englishMeaning,
              pos: `JLPT N${item.level || githubLevel}`,
              example_jp: `${kanjiTerm}（${furiganaReading}）の適切な用法を習得しましょう。`,
              example_kr: `${kanjiTerm} (${koreanMeaning})의 적절한 용법입니다.`,
              category: `N${item.level || githubLevel}`,
              mastery: 0
            };
          });

          const results = await Promise.all(formattedWordsPromises);
          const validNewWords = results.filter(Boolean);

          if (validNewWords.length > 0) {
            setWords(prev => [...validNewWords, ...prev]);
            showToast(`🎉 N${githubLevel} 단어 ${validNewWords.length}개를 수집해 한국어로 자동 번역하였습니다!`);
          } else {
            showToast("새로운 중복 없는 단어가 없습니다. 다시 시도해주세요.");
          }
        } catch (err) {
          console.error("API Fetch Error:", err);
          showToast("API 연결이 원활하지 않습니다.");
        } finally {
          setIsFetchingGithub(false);
        }
      };

      const handleAddCustomWord = (newWordObj) => {
        if (words.some(w => w.kanji === newWordObj.kanji)) {
          showToast("이미 등록되어 있는 단어입니다!");
          return false;
        }
        const formatted = {
          ...newWordObj,
          id: `custom_${Date.now()}`,
          mastery: 0
        };
        setWords(prev => [formatted, ...prev]);
        showToast("단어가 등록되었습니다.");
        return true;
      };

      const createNewSet = (setName, colorGradient) => {
        const newSet = {
          id: `set_${Date.now()}`,
          name: setName,
          wordIds: [],
          color: colorGradient || "from-sky-500 to-indigo-600"
        };
        setWordSets(prev => [...prev, newSet]);
        showToast(`'${setName}' 세트가 생성되었습니다.`);
      };

      const toggleWordInSet = (setId, wordId) => {
        setWordSets(prev => prev.map(s => {
          if (s.id === setId) {
            const exists = s.wordIds.includes(wordId);
            const updatedIds = exists ? s.wordIds.filter(id => id !== wordId) : [...s.wordIds, wordId];
            return { ...s, wordIds: updatedIds };
          }
          return s;
        }));
      };

      const playJapaneseAudio = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'ja-JP';
          utterance.rate = 0.85;
          window.speechSynthesis.speak(utterance);
        } else {
          showToast("음성 합성을 지원하지 않는 브라우저입니다.");
        }
      };

      const filteredWords = useMemo(() => {
        if (activeSetFilter === 'all') return words;
        if (activeSetFilter === 'saved') return words.filter(w => savedWordIds.includes(w.id));
        const targetSet = wordSets.find(s => s.id === activeSetFilter);
        if (targetSet) {
          return words.filter(w => targetSet.wordIds.includes(w.id));
        }
        return words;
      }, [words, savedWordIds, wordSets, activeSetFilter]);

      return (
        <div className="min-h-screen flex flex-col md:flex-row pb-20 md:pb-0 min-w-0">
          {/* Sidebar Navigation for Desktop */}
          <aside className="hidden md:flex flex-col w-72 glass-panel border-r border-white/10 p-6 space-y-8 sticky top-0 h-screen z-30 shrink-0">
            <div className="flex items-center justify-between">
              <div className="flex items-center space-x-3 min-w-0">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-rose-500 flex items-center justify-center shadow-lg shrink-0">

                </div>
                <div className="min-w-0 flex-1">
                  <h1 className="font-extrabold text-lg tracking-tight bg-gradient-to-r from-white via-indigo-200 to-purple-300 bg-clip-text text-transparent truncate">JLPT N2 Master</h1>
                  <p className="text-[11px] text-emerald-400 font-medium flex items-center space-x-1 truncate">
                    <Icon name="languages" className="w-3 h-3 text-emerald-400 shrink-0" />
                    <span className="truncate">실시간 한국어 번역</span>
                  </p>
                </div>
              </div>
            </div>

            <nav className="flex-1 space-y-2">
              <NavButton active={currentTab === 'flashcards'} onClick={() => setCurrentTab('flashcards')} icon="layers" label="플래시카드" count={filteredWords.length} />
              <NavButton active={currentTab === 'list'} onClick={() => setCurrentTab('list')} icon="book-open" label="단어장 / 검색" count={words.length} />
              <NavButton active={currentTab === 'sets'} onClick={() => setCurrentTab('sets')} icon="folder-kanban" label="단어 세트 관리" count={wordSets.length} />
              <NavButton active={currentTab === 'quiz'} onClick={() => setCurrentTab('quiz')} icon="brain-circuit" label="AI 퀴즈 테스트" />
              <NavButton active={currentTab === 'generator'} onClick={() => setCurrentTab('generator')} icon="github" label="GitHub API 가져오기" badge="API" />
            </nav>

            <div className="p-4 rounded-2xl glass-card border border-indigo-500/30 space-y-3 shrink-0">

                  <span>초기화</span>
                </button>

              <p className="text-xs text-slate-300">보관 단어: <strong className="text-emerald-400">{words.length}개</strong></p>
              <button

                disabled={isFetchingGithub}

              >
                {isFetchingGithub ? (
                  <span className="inline-block animate-spin font-bold">↻ 번역 수집 중...</span>
                ) : (
                  <>
                    <Icon name="sparkles" className="w-3.5 h-3.5 shrink-0" />
                    <span>API 추가 수집</span>
                  </>
                )}
              </button>
            </div>
          </aside>

          {/* Top Mobile Navigation Header */}
          <header className="md:hidden flex items-center justify-between p-4 glass-panel sticky top-0 z-40 border-b border-white/10 shrink-0">
            <div className="flex items-center space-x-2.5 min-w-0">
              <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-rose-500 flex items-center justify-center font-bold text-sm shrink-0">
                N2
              </div>
              <span className="font-bold text-base bg-gradient-to-r from-white to-purple-200 bg-clip-text text-transparent truncate">JLPT N2 Master</span>
            </div>
            <div className="flex items-center space-x-2 shrink-0">
              <button onClick={() => setShowResetModal(true)} className="p-2 rounded-xl bg-rose-500/20 text-rose-300 text-xs shrink-0" title="초기화">
                <Icon name="trash-2" className="w-4 h-4" />
              </button>
              <button
                onClick={() => fetchWordsFromGithubApi(false)}
                disabled={isFetchingGithub}
                className="px-3 py-1.5 rounded-xl bg-indigo-600/80 text-xs font-semibold flex items-center space-x-1 border border-indigo-400/30 shrink-0"
              >
                <Icon name="github" className="w-3.5 h-3.5 text-emerald-300 shrink-0" />
                <span>API 불러오기</span>
              </button>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 p-4 md:p-8 max-w-6xl mx-auto w-full overflow-y-auto min-w-0">
            {/* Filter Pills Bar */}
            <div className="mb-6 flex items-center justify-between flex-wrap gap-3 glass-card p-3 rounded-2xl border border-white/10 min-w-0">

              <div className="text-xs text-slate-400 font-medium px-2 shrink-0">

              </div>
            </div>

            {/* View Switcher */}
            {currentTab === 'flashcards' && (
              <FlashcardDeckView
                words={filteredWords}
                savedWordIds={savedWordIds}
                toggleBookmark={toggleBookmark}
                updateMastery={updateMastery}
                playAudio={playJapaneseAudio}
                onFetchMore={() => fetchWordsFromGithubApi(false)}

              />
            )}

            {currentTab === 'list' && (
              <VocabularyListView
                words={words}
                savedWordIds={savedWordIds}
                wordSets={wordSets}

                toggleWordInSet={toggleWordInSet}

                onAddCustomWord={handleAddCustomWord}
                onFetchMore={() => fetchWordsFromGithubApi(false)}
                isFetching={isFetchingGithub}
              />
            )}

            {currentTab === 'sets' && (
              <WordSetsManagerView
                wordSets={wordSets}
                words={words}
                onCreateSet={createNewSet}
                onSelectSetForStudy={(setId) => {
                  setActiveSetFilter(setId);
                  setCurrentTab('flashcards');
                }}
                toggleWordInSet={toggleWordInSet}
              />
            )}

            {currentTab === 'quiz' && (
              <QuizEngineView
                words={words}
                playAudio={playJapaneseAudio}
                updateMastery={updateMastery}
                onFetchMore={() => fetchWordsFromGithubApi(false)}
              />
            )}

            {currentTab === 'generator' && (
              <GitHubApiFetcher
                isFetching={isFetchingGithub}
                githubLevel={githubLevel}
                setGithubLevel={setGithubLevel}
                githubLimit={githubLimit}
                setGithubLimit={setGithubLimit}
                onFetch={fetchWordsFromGithubApi}
                totalWordCount={words.length}
              />
            )}
          </main>

          {/* Mobile Bottom Navigation Bar */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 glass-panel border-t border-white/10 p-2 z-50 flex items-center justify-around backdrop-blur-2xl bg-slate-950/90">
            <MobileNavTab active={currentTab === 'flashcards'} onClick={() => setCurrentTab('flashcards')} icon="layers" label="플래시카드" />
            <MobileNavTab active={currentTab === 'list'} onClick={() => setCurrentTab('list')} icon="book-open" label="단어목록" />
            <MobileNavTab active={currentTab === 'sets'} onClick={() => setCurrentTab('sets')} icon="folder-kanban" label="단어세트" />
            <MobileNavTab active={currentTab === 'quiz'} onClick={() => setCurrentTab('quiz')} icon="brain-circuit" label="퀴즈" />
            <MobileNavTab active={currentTab === 'generator'} onClick={() => setCurrentTab('generator')} icon="github" label="GitHub" />
          </nav>

          {/* Reset Confirmation Modal */}
          {showResetModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md min-w-0">
              <div className="glass-panel w-full max-w-sm rounded-3xl p-6 border border-white/20 space-y-4 text-center min-w-0">
                <div className="w-12 h-12 rounded-2xl bg-rose-500/20 text-rose-400 mx-auto flex items-center justify-center">
                  <Icon name="trash-2" className="w-6 h-6" />
                </div>
                <h3 className="text-lg font-bold text-white break-words">데이터 초기화</h3>
                <p className="text-xs text-slate-300 break-words">
                  모든 단어와 북마크가 초기 상태로 리셋됩니다. 계속하시겠습니까?
                </p>
                <div className="flex space-x-3 pt-2">
                  <button
                    onClick={() => setShowResetModal(false)}
                    className="flex-1 py-2.5 rounded-xl glass-card text-xs text-slate-300 font-semibold"
                  >
                    취소
                  </button>
                  <button
                    onClick={confirmResetAllData}
                    className="flex-1 py-2.5 rounded-xl bg-rose-600 text-white font-bold text-xs shadow-md"
                  >
                    초기화 실행
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed top-6 right-6 z-50 px-4 py-3 rounded-2xl glass-panel border border-indigo-400/40 shadow-xl text-sm font-semibold text-white flex items-center space-x-2 animate-bounce max-w-xs md:max-w-md min-w-0">
              <Icon name="info" className="w-4 h-4 text-indigo-400 shrink-0" />
              <span className="break-words">{toastMsg}</span>
            </div>
          )}
        </div>
      );
    }

    function NavButton({ active, onClick, icon, label, count, badge }) {
      return (
        <button
          onClick={onClick}
          className={`w-full flex items-center justify-between px-4 py-3 rounded-2xl font-medium text-sm transition-all duration-300 min-w-0 ${
            active
              ? 'bg-gradient-to-r from-indigo-600/80 to-purple-600/80 text-white border border-indigo-400/40 backdrop-blur-md shadow-lg'
              : 'text-slate-400 hover:text-white hover:bg-white/5'
          }`}
        >
          <div className="flex items-center space-x-3 min-w-0 flex-1 pr-2">
            <Icon name={icon} className={`w-5 h-5 shrink-0 ${active ? 'text-indigo-200' : 'text-slate-400'}`} />
            <span className="truncate">{label}</span>
          </div>
          {count !== undefined && (
            <span className={`text-xs px-2 py-0.5 rounded-full shrink-0 ${active ? 'bg-white/20 text-white' : 'bg-slate-800 text-slate-400'}`}>
              {count}
            </span>
          )}
          {badge && (
            <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500 text-white shrink-0">
              {badge}
            </span>
          )}
        </button>
      );
    }

    function MobileNavTab({ active, onClick, icon, label }) {
      return (
        <button
          onClick={onClick}
          className={`flex flex-col items-center justify-center p-2 rounded-xl transition min-w-0 ${
            active ? 'text-indigo-400 font-bold scale-105' : 'text-slate-400'
          }`}
        >
          <Icon name={icon} className="w-5 h-5 mb-1 shrink-0" />
          <span className="text-[10px] truncate max-w-[60px]">{label}</span>
        </button>
      );
    }

    function FilterChip({ active, onClick, label, count }) {
      return (
        <button
          onClick={onClick}
          className={`px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all flex items-center space-x-1.5 border shrink-0 ${
            active
              ? 'bg-indigo-600 border-indigo-400 text-white shadow-md'
              : 'bg-white/5 border-white/10 text-slate-300 hover:bg-white/10'
          }`}
        >
          <span className="max-w-[120px] truncate">{label}</span>
          <span className="text-[10px] opacity-75">({count})</span>
        </button>
      );
    }

    function FlashcardDeckView({ words, savedWordIds, toggleBookmark, updateMastery, playAudio, onFetchMore, isFetching }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);

      useEffect(() => {
        setCurrentIndex(0);
        setIsFlipped(false);
      }, [words]);

      if (!words || words.length === 0) {
        return (
          <div className="glass-card rounded-3xl p-8 md:p-12 text-center border border-white/10 my-8 space-y-6 max-w-xl mx-auto min-w-0">
            <div className="w-16 h-16 rounded-3xl bg-indigo-500/20 text-indigo-400 mx-auto flex items-center justify-center shrink-0">
              <Icon name="github" className="w-8 h-8" />
            </div>

              <p className="text-xs text-slate-400 max-w-md mx-auto break-words">
                아래 버튼을 눌러 GitHub API에서 JLPT N2 단어를 추가로 수집해 보세요!
              </p>
            </div>
            <button
              onClick={onFetchMore}
              disabled={isFetching}
              className="px-6 py-3 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold text-sm shadow-xl flex items-center justify-center space-x-2 mx-auto disabled:opacity-50 min-w-0"
            >

                <span>API 수집 및 번역 중...</span>
              ) : (
                <>
                  <Icon name="sparkles" className="w-4 h-4 shrink-0" />
                  <span>API에서 N2 단어 가져오기</span>
                </>
              )}
            </button>
          </div>
        );
      }

      const currentWord = words[currentIndex] || words[0];
      const isSaved = savedWordIds.includes(currentWord.id);

      const nextCard = () => {
        setIsFlipped(false);
        setTimeout(() => {
          setCurrentIndex(prev => (prev + 1) % words.length);
        }, 150);
      };

      const prevCard = () => {
        setIsFlipped(false);
        setTimeout(() => {
          setCurrentIndex(prev => (prev - 1 + words.length) % words.length);

      return (
        <div className="space-y-6 max-w-xl mx-auto min-w-0">

              {/* CARD FRONT */}

    function VocabularyListView({ words, savedWordIds, wordSets, toggleBookmark, toggleWordInSet, playAudio, onAddCustomWord, onFetchMore, isFetching }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [showAddModal, setShowAddModal] = useState(false);

      const [customKanji, setCustomKanji] = useState('');
      const [customFurigana, setCustomFurigana] = useState('');
      const [customMeaningKr, setCustomMeaningKr] = useState('');
      const [customExampleJp, setCustomExampleJp] = useState('');
      const [customExampleKr, setCustomExampleKr] = useState('');

      const categories = useMemo(() => {
        const set = new Set(words.map(w => w.category || "JLPT N2"));
        return Array.from(set);
      }, [words]);

      const filtered = words.filter(w => {
        const query = searchQuery.toLowerCase();
        const matchSearch = w.kanji.toLowerCase().includes(query) ||
                            w.furigana.toLowerCase().includes(query) ||
                            w.meaning_kr.toLowerCase().includes(query) ||
                            (w.meaning_en && w.meaning_en.toLowerCase().includes(query));
        const matchCat = selectedCategory === 'all' || (w.category || "JLPT N2") === selectedCategory;
        return matchSearch && matchCat;

          meaning_en: "",

          example_jp: customExampleJp || `${customKanji}の勉強をします。`,
          example_kr: customExampleKr || `${customMeaningKr} 학습을 진행합니다.`,
          category: "직접 추가"

        if (success) {
          setCustomKanji('');
          setCustomFurigana('');

                <div className="flex justify-between items-center min-w-0">
                  <h3 className="text-lg font-bold text-white flex items-center space-x-2 truncate pr-2">
                    <Icon name="plus-circle" className="w-5 h-5 text-indigo-400 shrink-0" />
                    <span className="truncate">나만의 N2 단어 추가</span>
                  </h3>
                  <button onClick={() => setShowAddModal(false)} className="text-slate-400 hover:text-white shrink-0">
                    <Icon name="x" className="w-5 h-5" />
                  </button>

                <form onSubmit={handleFormSubmit} className="space-y-3 min-w-0">
                  <div>
                    <label className="text-xs text-slate-300 font-medium">한자 / 표기 *</label>
                    <input
                      type="text"
                      required
                      placeholder="예: 把握"
                      value={customKanji}
                      onChange={e => setCustomKanji(e.target.value)}
                      className="w-full mt-1 p-2.5 rounded-xl glass-input text-sm"

                    <input

                    <input

                    <input

    function QuizEngineView({ words, playAudio, updateMastery, onFetchMore }) {
      const [quizIndex, setQuizIndex] = useState(0);
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [score, setScore] = useState(0);
      const [showResult, setShowResult] = useState(false);

      if (!words || words.length < 4) {
        return (
          <div className="glass-card rounded-3xl p-10 text-center space-y-4 max-w-lg mx-auto my-8 min-w-0">
            <Icon name="alert-circle" className="w-12 h-12 text-amber-400 mx-auto" />
            <h3 className="text-lg font-bold text-white break-words">퀴즈 진행을 위해 최소 4개 이상의 단어가 필요합니다.</h3>
            <p className="text-xs text-slate-400">API에서 추가 단어를 수집해 주세요.</p>
            <button
              onClick={onFetchMore}
              className="px-5 py-2.5 rounded-2xl bg-indigo-600 text-white font-semibold text-xs inline-flex items-center space-x-2"
            >
              <Icon name="sparkles" className="w-4 h-4 shrink-0" />
              <span>API 단어 수집하기</span>
            </button>
          </div>
        );
      }

      const currentTarget = words[quizIndex % words.length];

      const options = useMemo(() => {
        const distractors = words.filter(w => w.id !== currentTarget.id);
        const shuffled = [...distractors].sort(() => 0.5 - Math.random()).slice(0, 3);
        return [...shuffled, currentTarget].sort(() => 0.5 - Math.random());
      }, [currentTarget, words]);

      const handleSelectOption = (opt) => {
        if (selectedAnswer) return;
        setSelectedAnswer(opt);
        if (opt.id === currentTarget.id) {
          setScore(prev => prev + 1);
          updateMastery(currentTarget.id, 1);
        } else {
          updateMastery(currentTarget.id, -1);
        }
      };

      const handleNextQuestion = () => {
        setSelectedAnswer(null);
        if (quizIndex + 1 >= Math.min(10, words.length)) {
          setShowResult(true);
        } else {
          setQuizIndex(prev => prev + 1);
        }
      };

      const restartQuiz = () => {
        setQuizIndex(0);
        setSelectedAnswer(null);
        setScore(0);
        setShowResult(false);
      };

      if (showResult) {
        return (
          <div className="glass-card rounded-3xl p-8 md:p-10 max-w-lg mx-auto text-center space-y-6 min-w-0">
            <div className="w-20 h-20 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 mx-auto flex items-center justify-center shrink-0">
              <Icon name="trophy" className="w-10 h-10 text-amber-300" />
            </div>
            <h2 className="text-2xl font-bold text-white">퀴즈 완료!</h2>
            <p className="text-4xl font-black bg-gradient-to-r from-indigo-300 to-purple-300 bg-clip-text text-transparent">
              {score} / {Math.min(10, words.length)} 정답
            </p>
            <p className="text-xs text-slate-400">학습 결과가 암기 숙달도 지표에 즉시 반영되었습니다.</p>
            <button
              onClick={restartQuiz}
              className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold text-sm shadow-md"
            >
              다시 도전하기
            </button>
          </div>
        );
      }

      return (
        <div className="max-w-xl mx-auto space-y-6 min-w-0">
          <div className="flex items-center justify-between text-xs font-semibold text-slate-400 px-1 min-w-0">
            <span>문제 {quizIndex + 1} / {Math.min(10, words.length)}</span>
            <span>현재 점수: <strong className="text-indigo-400">{score}점</strong></span>
          </div>

          <div className="glass-panel rounded-3xl p-6 md:p-8 text-center space-y-4 border border-white/20 min-w-0">
            <span className="text-xs font-semibold text-indigo-300 px-3 py-1 rounded-full bg-indigo-500/20 inline-block max-w-full truncate">
              다음 한자의 올바른 한국어 뜻을 선택하세요
            </span>
            <div className="text-xs text-slate-400 break-jp">{currentTarget.furigana}</div>
            <h2 className="text-3xl sm:text-4xl md:text-5xl font-black text-white break-jp leading-tight">{currentTarget.kanji}</h2>
            <button
              onClick={() => playAudio(currentTarget.kanji)}
              className="p-2 rounded-xl bg-white/10 hover:bg-white/20 text-indigo-300 mx-auto inline-flex items-center space-x-1 text-xs shrink-0"
            >
              <Icon name="volume-2" className="w-4 h-4 shrink-0" />
              <span>발음 듣기</span>
            </button>
          </div>

          <div className="space-y-3 min-w-0">
            {options.map((opt, idx) => {
              let btnStyle = "glass-card border-white/10 hover:border-indigo-400/40 text-slate-200";
              if (selectedAnswer) {
                if (opt.id === currentTarget.id) {
                  btnStyle = "bg-emerald-600/80 border-emerald-400 text-white font-bold";
                } else if (selectedAnswer.id === opt.id) {
                  btnStyle = "bg-rose-600/80 border-rose-400 text-white";
                }
              }

              return (
                <button
                  key={opt.id}
                  onClick={() => handleSelectOption(opt)}
                  disabled={selectedAnswer !== null}
                  className={`w-full p-4 rounded-2xl border text-left text-sm font-semibold transition flex items-center justify-between min-w-0 ${btnStyle}`}
                >
                  <div className="flex items-center space-x-3 min-w-0 flex-1 pr-2">
                    <span className="w-6 h-6 rounded-lg bg-white/10 flex items-center justify-center text-xs shrink-0 font-bold">
                      {idx + 1}
                    </span>
                    <span className="break-words min-w-0 flex-1 leading-snug">{opt.meaning_kr}</span>
                  </div>
                  {selectedAnswer && opt.id === currentTarget.id && (
                    <Icon name="check-circle" className="w-5 h-5 text-emerald-300 shrink-0" />
                  )}
                </button>
              );
            })}
          </div>

          {selectedAnswer && (
            <button
              onClick={handleNextQuestion}
              className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold text-sm shadow-md animate-bounce"
            >
              다음 문제로 이동
            </button>
          )}
        </div>
      );
    }

    function GitHubApiFetcher({ isFetching, githubLevel, setGithubLevel, githubLimit, setGithubLimit, onFetch, totalWordCount }) {
      const levels = [
        { level: 1, label: "N1 (고급)" },
        { level: 2, label: "N2 (중상급 - 권장)" },
        { level: 3, label: "N3 (중급)" },
        { level: 4, label: "N4 (초중급)" },
        { level: 5, label: "N5 (초급)" }
      ];

      return (
        <div className="max-w-2xl mx-auto space-y-6 min-w-0">
          <div className="glass-panel rounded-3xl p-6 md:p-8 border border-white/20 space-y-6 text-center min-w-0">
            <div className="w-16 h-16 rounded-3xl bg-gradient-to-tr from-emerald-500 via-teal-500 to-indigo-500 mx-auto flex items-center justify-center shadow-lg shrink-0">
              <Icon name="github" className="w-9 h-9 text-white" />
            </div>

            <div className="min-w-0">
              <h2 className="text-2xl font-black text-white break-words">GitHub API & 한국어 자동 번역</h2>
              <p className="text-xs text-slate-300 mt-2 break-words">
                Open Source JLPT 어휘 API 연동 및 Google 번역 엔지니어링 실시간 변환
              </p>
              <p className="text-xs text-slate-400 mt-1">
                현재 보관소 총 어휘: <strong className="text-emerald-300">{totalWordCount}개 단어</strong>
              </p>
            </div>

            <div className="space-y-2 text-left min-w-0">
              <label className="text-xs font-semibold text-slate-300">JLPT 레벨 선택:</label>
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 min-w-0">
                {levels.map(l => (
                  <button
                    key={l.level}
                    onClick={() => setGithubLevel(l.level)}
                    className={`p-3 rounded-2xl border text-xs font-semibold transition truncate ${
                      githubLevel === l.level
                        ? 'bg-gradient-to-r from-emerald-600 to-indigo-600 border-emerald-400 text-white shadow-md'
                        : 'glass-card border-white/10 text-slate-300 hover:bg-white/10'
                    }`}
                  >
                    {l.label}
                  </button>
                ))}
              </div>
            </div>

            <div className="space-y-2 text-left min-w-0">
              <label className="text-xs font-semibold text-slate-300">수집할 단어 수:</label>
              <div className="flex space-x-2 min-w-0">
                {[5, 10, 20, 30].map(cnt => (
                  <button
                    key={cnt}
                    onClick={() => setGithubLimit(cnt)}
                    className={`flex-1 py-2.5 rounded-xl border text-xs font-bold transition ${
                      githubLimit === cnt
                        ? 'bg-indigo-600 border-indigo-400 text-white shadow-md'
                        : 'glass-card border-white/10 text-slate-400 hover:text-white'
                    }`}
                  >
                    {cnt}개씩
                  </button>
                ))}
              </div>
            </div>

            <div className="flex flex-col sm:flex-row gap-3 pt-2 min-w-0">
              <button
                onClick={() => onFetch(false)}
                disabled={isFetching}
                className="flex-1 py-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:opacity-90 text-white font-bold text-sm shadow-md transition flex items-center justify-center space-x-2 disabled:opacity-50 min-w-0"
              >
                {isFetching ? (
                  <span>수집 및 번역 처리 중...</span>
                ) : (
                  <>
                    <Icon name="languages" className="w-5 h-5 text-emerald-300 shrink-0" />
                    <span className="truncate">N{githubLevel} 단어 {githubLimit}개 수집 및 번역</span>
                  </>
                )}
              </button>
              <button
                onClick={() => onFetch(true)}
                disabled={isFetching}
                className="py-4 px-6 rounded-2xl glass-card border border-emerald-500/40 hover:bg-emerald-500/20 text-emerald-300 font-bold text-sm shadow-md transition flex items-center justify-center space-x-2 disabled:opacity-50 shrink-0"
              >
                <Icon name="sparkles" className="w-4 h-4 text-emerald-300 shrink-0" />
                <span>랜덤 단어 추가</span>
              </button>
            </div>

            <div className="p-4 rounded-2xl bg-black/30 border border-white/5 text-xs text-slate-400 text-left space-y-1 min-w-0">
              <div className="text-emerald-300 font-semibold flex items-center space-x-1">
                <Icon name="info" className="w-3.5 h-3.5 shrink-0" />
                <span>안내:</span>
              </div>
              <p className="text-[11px] text-slate-400 break-words">
                수집된 영어 단어 뜻은 실시간 번역 파이프라인을 거쳐 즉시 자연스러운 한국어 뜻으로 변환 등록됩니다.
              </p>
            </div>
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
